name: Deploy CloudFleet to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy CloudFleet
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      APPLICATION_NAME: CloudFleet
      ENVIRONMENT_NAME: CloudFleet-dev
      S3_BUCKET: cloudfleet-deployments-928003954894
      VERSION_LABEL: github-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::928003954894:role/CloudFleetGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment ZIP
        run: |
          zip -r cloudfleet.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "aws/*" \
            -x "database/migrate.php" \
            -x "database/migrations/*" \
            -x "README.md" \
            -x "FINAL_CHECKLIST.md" \
            -x ".env.example" \
            -x ".gitattributes" \
            -x "*.zip"

      - name: Upload deployment bundle to S3
        run: |
          aws s3 cp cloudfleet.zip \
            "s3://$S3_BUCKET/$VERSION_LABEL.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="$VERSION_LABEL.zip" \
            --region "$AWS_REGION"

      - name: Deploy to CloudFleet-dev
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL" \
            --region "$AWS_REGION"

      - name: Wait for Elastic Beanstalk deployment
        run: |
          for i in {1..30}
          do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "$ENVIRONMENT_NAME" \
              --query "Environments[0].Status" \
              --output text \
              --region "$AWS_REGION")

            HEALTH=$(aws elasticbeanstalk describe-environments \
              --environment-names "$ENVIRONMENT_NAME" \
              --query "Environments[0].Health" \
              --output text \
              --region "$AWS_REGION")

            CURRENT_VERSION=$(aws elasticbeanstalk describe-environments \
              --environment-names "$ENVIRONMENT_NAME" \
              --query "Environments[0].VersionLabel" \
              --output text \
              --region "$AWS_REGION")

            echo "Status: $STATUS | Health: $HEALTH | Version: $CURRENT_VERSION"

            if [ "$STATUS" = "Ready" ] && \
               [ "$CURRENT_VERSION" = "$VERSION_LABEL" ] && \
               [ "$HEALTH" = "Green" ]
            then
              echo "CloudFleet deployment completed successfully."
              exit 0
            fi

            if [ "$STATUS" = "Ready" ] && \
               [ "$CURRENT_VERSION" = "$VERSION_LABEL" ] && \
               [ "$HEALTH" = "Red" ]
            then
              echo "Elastic Beanstalk deployment is unhealthy."
              exit 1
            fi

            sleep 20
          done

          echo "Deployment timed out."
          exit 1
