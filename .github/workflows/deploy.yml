name: Deploy CloudFleet to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      APPLICATION_NAME: CloudFleet
      ENVIRONMENT_NAME: CloudFleet-dev
      S3_BUCKET: cloudfleet-deployments-928003954894
      VERSION_LABEL: github-${{ github.run_id }}-${{ github.run_attempt }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::928003954894:role/CloudFleetGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment ZIP
        run: |
          zip -r cloudfleet.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.zip"

      - name: Upload deployment bundle to S3
        run: |
          aws s3 cp cloudfleet.zip \
            s3://${{ env.S3_BUCKET }}/${{ env.VERSION_LABEL }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.APPLICATION_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}" \
            --source-bundle S3Bucket=${{ env.S3_BUCKET }},S3Key=${{ env.VERSION_LABEL }}.zip

      - name: Deploy to CloudFleet-dev
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.ENVIRONMENT_NAME }}" \
            --version-label "${{ env.VERSION_LABEL }}"